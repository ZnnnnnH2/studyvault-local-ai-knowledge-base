[project]
name = "studyvault"
version = "0.1.0"
description = "StudyVault: a relational knowledge base for AI-assisted learning conversations"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.20",
]

[tool.uv]
package = false
default-groups = []

[dependency-groups]
dev = ["httpx>=0.28", "playwright>=1.55"]
